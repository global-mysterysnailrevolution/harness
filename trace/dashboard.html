<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Claude Trace</title>
<style>
:root{--bg:#090a0f;--bg2:#111219;--bg3:#191a24;--bg4:#222336;--bdr:#282a3a;--tx:#c8cad0;--tx2:#888a95;--tx3:#555668;--tx4:#333445;--cyan:#00e5cc;--purple:#a78bfa;--gold:#f0b429;--green:#34d399;--red:#f87171;--blue:#60a5fa;--orange:#fb923c;--pink:#f472b6;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--tx);font-family:'SF Mono','Cascadia Code','Consolas',monospace;font-size:13px;overflow:hidden;}
.app{display:grid;grid-template-columns:180px 1fr;grid-template-rows:38px 1fr;height:100vh;}
header{grid-column:1/3;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--bdr);z-index:20;}
header h1{font-size:13px;color:var(--cyan);font-weight:700;letter-spacing:2px;}
.chip{padding:2px 7px;border-radius:3px;background:var(--bg3);font-size:10px;color:var(--tx2);}
.chip b{font-weight:700;}
.hc{margin-left:auto;display:flex;gap:5px;}
.hc button{background:var(--bg3);border:1px solid var(--bdr);color:var(--tx2);padding:2px 10px;border-radius:3px;cursor:pointer;font-size:10px;font-family:inherit;}
.hc button:hover,.hc button.on{border-color:var(--cyan);color:var(--cyan);}
.sb{background:var(--bg2);border-right:1px solid var(--bdr);overflow-y:auto;padding:6px 0;}
.sb-t{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;padding:6px 10px 4px;}
.sb-i{padding:6px 10px;cursor:pointer;border-left:2px solid transparent;font-size:11px;display:flex;align-items:center;gap:6px;}
.sb-i:hover{background:var(--bg3);}.sb-i.sel{background:var(--bg3);border-left-color:var(--cyan);}
.sb-i .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sb-i .dot.on{background:var(--green);box-shadow:0 0 6px var(--green);}.sb-i .dot.off{background:var(--tx4);}
.sb-i .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-i .cnt{color:var(--tx3);font-size:9px;}
.graph-wrap{position:relative;overflow:hidden;}
.panel{position:absolute;top:0;right:0;width:400px;height:100%;background:var(--bg2);border-left:1px solid var(--bdr);transform:translateX(100%);transition:transform .2s ease;z-index:5;display:flex;flex-direction:column;overflow:hidden;}
.panel.open{transform:translateX(0);}
.panel-head{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bdr);flex-shrink:0;gap:5px;}
.panel-head .close{cursor:pointer;color:var(--tx3);font-size:14px;margin-left:auto;padding:2px 6px;border-radius:3px;}
.panel-head .close:hover{color:var(--tx);}
.panel-body{flex:1;overflow-y:auto;padding:10px 12px;}
.ds{margin-bottom:12px;}.dl{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.dm{background:var(--bg3);border-radius:4px;padding:6px 8px;font-size:11px;color:var(--tx2);line-height:1.5;max-height:100px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;}
.dr{display:flex;justify-content:space-between;padding:2px 0;font-size:11px;border-bottom:1px solid rgba(40,42,58,.2);}
.dr .k{color:var(--tx2);}.dr .v{font-weight:600;}
.ti{padding:4px 8px;margin:2px 0;border-radius:4px;font-size:11px;border-left:3px solid var(--tx4);background:var(--bg3);cursor:pointer;}
.ti.act{border-left-color:var(--green);color:var(--green);}.ti.err{border-left-color:var(--red);color:var(--red);}.ti.done{color:var(--tx3);}
.ti .th{display:flex;justify-content:space-between;gap:4px;}
.ti .td{font-size:10px;color:var(--tx3);margin-top:3px;display:none;line-height:1.4;max-height:100px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;}
.ti.exp .td{display:block;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>◇ TRACE</h1>
    <div class="chip">Spans <b style="color:var(--cyan)" id="h-sp">0</b></div>
    <div class="chip">Active <b style="color:var(--green)" id="h-a">0</b></div>
    <div class="chip">Errors <b style="color:var(--red)" id="h-e">0</b></div>
    <div class="chip">~Cost <b style="color:var(--gold)" id="h-c">$0</b></div>
    <div class="hc"><button onclick="clearAll()">Clear</button><button id="bp" onclick="togglePause()">Pause</button></div>
  </header>
  <div class="sb"><div class="sb-t">Sessions</div><div id="sb-l"></div></div>
  <div class="graph-wrap" id="gw">
    <div id="svg-scroll" style="width:100%;height:100%;overflow:auto"><svg id="svg"></svg></div>
    <div class="panel" id="panel">
      <div class="panel-head">
        <span id="p-icon" style="font-size:14px">◈</span>
        <span id="p-name" style="font-size:12px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
        <span class="close" onclick="closePanel()">✕</span>
      </div>
      <div class="panel-body" id="p-body"></div>
    </div>
  </div>
</div>
<script>
const ST={events:[],spans:[],sid:null,paused:false,sel:null,panW:400};
const COL={Agent:'#00e5cc',Skill:'#f0b429',Read:'#fb923c',Write:'#fb923c',Edit:'#fb923c',
  Bash:'#a78bfa',Glob:'#fb923c',Grep:'#fb923c',WebFetch:'#60a5fa',WebSearch:'#60a5fa',
  ToolSearch:'#888a95',CronCreate:'#34d399',default:'#888a95'};
function tc(t){return COL[t]||COL.default;}

function bn(p){return p?String(p).replace(/\\/g,'/').split('/').pop():'';}
function ft(ts){try{return new Date(ts).toLocaleTimeString('en',{hour12:false});}catch{return'--';}}
function fd(ms){if(ms==null)return'';if(ms<1000)return ms+'ms';if(ms<60000)return(ms/1000).toFixed(1)+'s';return(ms/60000).toFixed(1)+'m';}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function mkLbl(sp){
  const t=sp.tool,i=sp.input||{};
  if(t==='Agent')return i.description?.slice(0,60)||i.prompt?.slice(0,60)||'Agent';
  if(t==='Skill')return'/'+(i.skill||'skill');
  if(t==='Bash')return'$ '+(i.command||'').slice(0,50);
  if(t==='Read')return bn(i.file_path);if(t==='Write')return bn(i.file_path);
  if(t==='Edit')return bn(i.file_path);if(t==='Glob')return(i.pattern||'').slice(0,30);
  if(t==='Grep')return(i.pattern||'').slice(0,30);
  if(t==='WebFetch')return(i.url||'').slice(0,40);if(t==='WebSearch')return(i.query||'').slice(0,30);
  return t;
}

function bSpans(events){
  const spans=[],stacks={};
  for(const ev of events){
    const sid=ev.sid||'?';if(!stacks[sid])stacks[sid]=[];const sk=stacks[sid];
    const t=ev.tool||ev.event?.tool_name||'?';
    const inp=ev.event?.tool_input||ev.event?.input||{};
    if(ev.phase==='pre'){
      const sp={id:ev.ts+'-'+t+'-'+spans.length,sid,tool:t,
        start:ev.ts,end:null,parent:sk.length?sk[sk.length-1].id:null,children:[],status:'active',depth:sk.length,
        input:inp,output:null,project:ev.project||'',label:'',
        prompt:inp.prompt||inp.description||'',description:inp.description||''};
      sp.label=mkLbl(sp);
      if(sk.length)sk[sk.length-1].children.push(sp.id);
      spans.push(sp);if(t==='Agent'||t==='Skill')sk.push(sp);
    }else if(ev.phase==='post'){
      for(let i=spans.length-1;i>=0;i--){
        if(spans[i].tool===t&&spans[i].status==='active'&&spans[i].sid===sid){
          spans[i].end=ev.ts;spans[i].status=ev.has_error?'error':'complete';
          spans[i].output=ev.event?.tool_output||ev.event?.output;
          spans[i].duration_ms=new Date(ev.ts)-new Date(spans[i].start);
          if((t==='Agent'||t==='Skill')&&sk.length)sk.pop();break;
        }
      }
    }
  }
  return spans;
}
function filt(){return ST.sid?ST.events.filter(e=>e.sid===ST.sid):ST.events;}

// ─── SIDEBAR ───
function rSess(){
  const map={};
  for(const ev of ST.events){const sid=ev.sid||'?';
    if(!map[sid])map[sid]={sid,project:'',last:ev.ts,count:0};
    map[sid].last=ev.ts;map[sid].count++;
    if(ev.project&&ev.project!=='unknown')map[sid].project=ev.project;}
  const sessions=Object.values(map).sort((a,b)=>new Date(b.last)-new Date(a.last));
  let h='';
  for(const s of sessions){
    const on=(Date.now()-new Date(s.last).getTime())<60000;
    h+=`<div class="sb-i${ST.sid===s.sid?' sel':''}" onclick="pickSid('${s.sid}')"><span class="dot ${on?'on':'off'}"></span><span class="lbl">${esc(s.project||s.sid)}</span><span class="cnt">${s.count}</span></div>`;
  }
  if(!sessions.length) h='<div style="padding:20px 10px;color:var(--tx3);font-size:11px;text-align:center">Waiting for events...</div>';
  document.getElementById('sb-l').innerHTML=h;
}
function pickSid(sid){ST.sid=sid;ST.sel=null;closePanel();ST.spans=bSpans(filt());render();}

// ─── BUILD TREE ───
// Returns flat list of tree nodes: root → agents → tool-class groups
function buildTree(){
  const spans=ST.spans;
  if(!spans.length) return [];

  const agents=spans.filter(s=>s.tool==='Agent'||s.tool==='Skill');
  const nodes=[];

  // Root = session orchestrator
  const proj=ST.events.find(e=>e.sid===ST.sid&&e.project&&e.project!=='unknown')?.project||ST.sid;
  const rootId='__root__';
  nodes.push({id:rootId,label:proj,type:'root',status:'active',parentId:null,kids:[]});

  // Agent/Skill nodes
  for(const a of agents){
    const parentAgent=agents.find(x=>x.id===a.parent);
    nodes.push({id:a.id,label:a.label,type:a.tool==='Skill'?'skill':'agent',
      status:a.status,parentId:parentAgent?parentAgent.id:rootId,kids:[],
      span:a,duration:a.duration_ms});
  }

  // Tool-class groups under each agent (and under root for top-level tool calls)
  const containers=[rootId,...agents.map(a=>a.id)];
  for(const cid of containers){
    const children=spans.filter(s=>{
      if(s.tool==='Agent'||s.tool==='Skill') return false;
      if(cid===rootId) return !s.parent;
      return s.parent===cid;
    });
    if(!children.length) continue;
    const groups={};
    for(const c of children){
      if(!groups[c.tool]) groups[c.tool]={tool:c.tool,spans:[],active:0,errors:0};
      groups[c.tool].spans.push(c);
      if(c.status==='active') groups[c.tool].active++;
      if(c.status==='error') groups[c.tool].errors++;
    }
    for(const[tool,g]of Object.entries(groups)){
      const gid=cid+':'+tool;
      const status=g.active>0?'active':(g.errors>0?'error':'complete');
      nodes.push({id:gid,label:tool+' ×'+g.spans.length,type:'group',tool,
        status,parentId:cid,kids:[],groupSpans:g.spans,count:g.spans.length,
        active:g.active,errors:g.errors});
    }
  }

  // Wire up kids arrays
  for(const n of nodes){
    if(n.parentId){
      const p=nodes.find(x=>x.id===n.parentId);
      if(p) p.kids.push(n.id);
    }
  }

  return nodes;
}

// ─── LAYOUT: recursive tree, left→right ───
const NW=170,NH=44,GW=110,GH=30,PAD_X=40,PAD_Y=8;
function layoutTree(nodes){
  if(!nodes.length) return;
  const root=nodes.find(n=>n.type==='root');if(!root) return;

  // Recursive: compute subtree height, then assign y positions
  function subtreeH(nid){
    const n=nodes.find(x=>x.id===nid);if(!n) return 0;
    const h=n.type==='group'?GH:NH;
    if(!n.kids.length) return h;
    let total=0;
    for(const kid of n.kids) total+=subtreeH(kid)+PAD_Y;
    return Math.max(h, total-PAD_Y);
  }

  function layout(nid,x,y){
    const n=nodes.find(nd=>nd.id===nid);if(!n) return;
    const w=n.type==='group'?GW:NW;
    const h=n.type==='group'?GH:NH;
    const subH=subtreeH(nid);
    n.x=x; n.y=y+(subH-h)/2; n.w=w; n.h=h;
    if(!n.kids.length) return;
    let cy=y;
    for(const kid of n.kids){
      const kh=subtreeH(kid);
      layout(kid,x+w+PAD_X,cy);
      cy+=kh+PAD_Y;
    }
  }

  layout(root.id,30,20);
}

// ─── RENDER ───
function rGraph(){
  const svg=document.getElementById('svg');
  const wrap=document.getElementById('gw');

  if(!ST.sid||!ST.spans.length){
    const W=wrap.clientWidth,H=wrap.clientHeight;
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.style.width=W+'px';svg.style.height=H+'px';
    svg.innerHTML=`<text x="${W/2}" y="${H/2}" fill="#555668" text-anchor="middle" font-family="inherit" font-size="13">${ST.sid?'◇ No spans yet':'◇ Select a session'}</text>`;
    return;
  }

  const nodes=buildTree();
  layoutTree(nodes);

  // SVG size = bounding box of all nodes
  let maxX=0,maxY=0;
  for(const n of nodes){if(n.x!=null){maxX=Math.max(maxX,n.x+n.w+40);maxY=Math.max(maxY,n.y+n.h+40);}}
  const viewW=wrap.clientWidth-(ST.sel?ST.panW:0);
  const W=Math.max(maxX,viewW);
  const H=Math.max(maxY,wrap.clientHeight);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.style.width=W+'px';svg.style.height=H+'px';

  const sel=ST.sel;const hasSel=!!sel;
  // Highlight: selected node + its parent + its children
  let relSet=new Set();
  if(sel){
    relSet.add(sel);
    const sn=nodes.find(n=>n.id===sel);
    if(sn){if(sn.parentId)relSet.add(sn.parentId);for(const k of sn.kids)relSet.add(k);}
  }

  let s='<defs>';
  s+=`<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  s+='</defs>';

  // ─── EDGES ───
  for(const n of nodes){
    if(!n.parentId||n.x==null) continue;
    const p=nodes.find(x=>x.id===n.parentId);
    if(!p||p.x==null) continue;
    const x1=p.x+p.w, y1=p.y+p.h/2, x2=n.x, y2=n.y+n.h/2;
    const mx=x1+(x2-x1)*0.5;

    const isHi=hasSel&&relSet.has(n.id)&&relSet.has(p.id);
    const isAct=n.status==='active'||p.status==='active';
    const col=isHi?tc(n.type==='group'?n.tool:(n.type==='skill'?'Skill':'Agent')):(isAct?'#333':'#222');
    const op=hasSel?(isHi?0.7:0.06):(isAct?0.5:0.2);
    const w=isHi?2:(isAct?1.5:1);

    // Smooth step curve
    s+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${w}" opacity="${op}"/>`;
    // Arrowhead
    if(isHi||!hasSel){
      const as=isHi?5:3;
      s+=`<polygon points="${x2},${y2} ${x2-as*1.5},${y2-as} ${x2-as*1.5},${y2+as}" fill="${col}" opacity="${op}"/>`;
    }
  }

  // ─── NODES ───
  for(const n of nodes){
    if(n.x==null) continue;
    const isSel=sel===n.id;
    const isRel=relSet.has(n.id);
    const isAct=n.status==='active';
    const isErr=n.status==='error';
    const isGrp=n.type==='group';
    const col=n.type==='root'?'#00e5cc':isGrp?tc(n.tool):(n.type==='skill'?'#f0b429':'#00e5cc');

    let bgOp,brOp,txOp,sw;
    if(isSel){bgOp=.2;brOp=1;txOp=1;sw=2.5;}
    else if(isRel&&hasSel){bgOp=.1;brOp=.6;txOp=.8;sw=1.5;}
    else if(hasSel){bgOp=.015;brOp=.07;txOp=.15;sw=1;}
    else{bgOp=isAct?.12:(isGrp?.04:.05);brOp=isAct?.8:(isGrp?.25:.25);txOp=isAct?1:(isGrp?.55:.5);sw=isGrp?1:1.5;}

    const rx=isGrp?5:8;
    const flt=isSel?' filter="url(#glow)"':'';
    s+=`<g style="cursor:pointer" onclick="selNode('${n.id}')"${flt}>`;

    // Selection ring
    if(isSel) s+=`<rect x="${n.x-3}" y="${n.y-3}" width="${n.w+6}" height="${n.h+6}" rx="${rx+2}" fill="none" stroke="${col}" stroke-width="1" opacity=".3" stroke-dasharray="3,2"><animate attributeName="stroke-dashoffset" values="0;10" dur="1.2s" repeatCount="indefinite"/></rect>`;

    s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${rx}" fill="${col}" opacity="${bgOp}"/>`;
    s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${rx}" fill="none" stroke="${col}" stroke-width="${sw}" opacity="${brOp}"/>`;

    // Active pulse
    if(isAct&&!hasSel) s+=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${rx}" fill="${col}" opacity="0"><animate attributeName="opacity" values=".08;.02;.08" dur="2s" repeatCount="indefinite"/></rect>`;

    if(isGrp){
      // Tool group: icon + "Tool ×N"
      const icon={Read:'◆',Write:'◆',Edit:'◆',Bash:'▸',Glob:'◆',Grep:'◆',WebFetch:'⊕',WebSearch:'⊕',ToolSearch:'◇',CronCreate:'↻'}[n.tool]||'◇';
      s+=`<text x="${n.x+8}" y="${n.y+19}" fill="${col}" font-size="10" opacity="${txOp}">${icon}</text>`;
      s+=`<text x="${n.x+20}" y="${n.y+19}" fill="${col}" font-family="inherit" font-size="10" opacity="${txOp}">${esc(n.label)}</text>`;
      // Active dot
      if(n.active>0) s+=`<circle cx="${n.x+n.w-10}" cy="${n.y+n.h/2}" r="3" fill="#34d399" opacity="${txOp}"><animate attributeName="opacity" values="${txOp};.2;${txOp}" dur="1.5s" repeatCount="indefinite"/></circle>`;
      if(n.errors>0){const ex=n.active?20:10;s+=`<circle cx="${n.x+n.w-ex}" cy="${n.y+n.h/2}" r="3" fill="#f87171" opacity="${txOp}"/>`;}
    }else{
      // Agent/root/skill node
      const icon=n.type==='root'?'⬡':(n.type==='skill'?'⚡':'◈');
      s+=`<text x="${n.x+10}" y="${n.y+18}" fill="${col}" font-size="13" opacity="${txOp}">${icon}</text>`;
      const label=(n.label||'').slice(0,18);
      s+=`<text x="${n.x+26}" y="${n.y+18}" fill="${col}" font-family="inherit" font-size="11" font-weight="600" opacity="${txOp}">${esc(label)}</text>`;
      // Status
      const stxt=isAct?'● running':(isErr?'✕ error':`✓ ${fd(n.duration)}`);
      const scol=isAct?'#34d399':(isErr?'#f87171':'#555668');
      s+=`<text x="${n.x+10}" y="${n.y+33}" fill="${scol}" font-family="inherit" font-size="9" opacity="${txOp}">${stxt}</text>`;
      // Child count badge
      if(n.kids.length>0){
        s+=`<rect x="${n.x+n.w-26}" y="${n.y+4}" width="20" height="13" rx="6" fill="${col}" opacity=".12"/>`;
        s+=`<text x="${n.x+n.w-16}" y="${n.y+14}" fill="${col}" font-family="inherit" font-size="9" text-anchor="middle" opacity="${txOp*.7}">${n.kids.length}</text>`;
      }
    }
    s+=`</g>`;
  }

  svg.innerHTML=s;
}

// ─── PANEL ───
function selNode(id){
  ST.sel=id;document.getElementById('panel').classList.add('open');
  const nodes=buildTree();const n=nodes.find(x=>x.id===id);
  document.getElementById('p-name').textContent=n?n.label:id;
  const col=n?(n.type==='root'?'#00e5cc':(n.type==='group'?tc(n.tool):(n.type==='skill'?'#f0b429':'#00e5cc'))):'#888';
  document.getElementById('p-icon').style.color=col;
  document.getElementById('p-icon').textContent=n?(n.type==='root'?'⬡':(n.type==='group'?'◆':(n.type==='skill'?'⚡':'◈'))):'?';
  renderPanel();rGraph();
}
function closePanel(){ST.sel=null;document.getElementById('panel').classList.remove('open');rGraph();}

function renderPanel(){
  const body=document.getElementById('p-body');
  if(!ST.sel){body.innerHTML='';return;}
  const nodes=buildTree();const n=nodes.find(x=>x.id===ST.sel);
  if(!n){body.innerHTML='';return;}
  if(n.type==='root') return renderPanelRoot(body,n,nodes);
  if(n.type==='group') return renderPanelGroup(body,n,nodes);
  return renderPanelAgent(body,n,nodes);
}

function renderPanelRoot(body,n,nodes){
  const childAgents=nodes.filter(x=>x.parentId===n.id&&x.type!=='group');
  const childGroups=nodes.filter(x=>x.parentId===n.id&&x.type==='group');
  let h=`<div class="ds"><div class="dl">Session</div><div class="dm">${esc(n.label)}\nSession ID: ${esc(ST.sid)}\nSpans: ${ST.spans.length}\nActive: ${ST.spans.filter(s=>s.status==='active').length}</div></div>`;
  if(childAgents.length){
    h+=`<div class="ds"><div class="dl">Agents (${childAgents.length})</div>`;
    for(const a of childAgents) h+=nodeLink(a);
    h+=`</div>`;
  }
  if(childGroups.length){
    h+=`<div class="ds"><div class="dl">Direct Tool Usage</div>`;
    for(const g of childGroups) h+=nodeLink(g);
    h+=`</div>`;
  }
  body.innerHTML=h;
}

function renderPanelGroup(body,n,nodes){
  const spans=n.groupSpans||[];
  const parent=nodes.find(x=>x.id===n.parentId);
  let h=`<div class="ds"><div class="dl">Tool Class: ${esc(n.tool)}</div>
    <div class="dr"><span class="k">Total calls</span><span class="v">${spans.length}</span></div>
    <div class="dr"><span class="k">Active</span><span class="v" style="color:var(--green)">${n.active||0}</span></div>
    <div class="dr"><span class="k">Errors</span><span class="v" style="color:var(--red)">${n.errors||0}</span></div>
    <div class="dr"><span class="k">Total time</span><span class="v">${fd(spans.reduce((s,sp)=>s+(sp.duration_ms||0),0))}</span></div>
  </div>`;
  if(parent) h+=`<div class="ds"><div class="dl">Parent</div>${nodeLink(parent)}</div>`;
  h+=`<div class="ds"><div class="dl">All ${spans.length} Calls</div>`;
  for(const sp of spans){
    const cls=sp.status==='active'?'act':(sp.status==='error'?'err':'done');
    const icon=sp.status==='active'?'●':(sp.status==='error'?'✕':'✓');
    const inp=sp.input?JSON.stringify(sp.input,null,2).slice(0,400):'';
    const out=sp.output?(typeof sp.output==='string'?sp.output.slice(0,300):JSON.stringify(sp.output).slice(0,300)):'';
    h+=`<div class="ti ${cls}" onclick="this.classList.toggle('exp')"><div class="th"><span>${esc(sp.label.slice(0,45))}</span><span style="font-size:9px;flex-shrink:0">${icon} ${fd(sp.duration_ms)}</span></div><div class="td">${inp?'INPUT:\n'+esc(inp):''}${out?'\nOUTPUT:\n'+esc(out):''}</div></div>`;
  }
  h+=`</div>`;
  body.innerHTML=h;
}

function renderPanelAgent(body,n,nodes){
  const sp=n.span;
  const prompt=sp?.prompt||sp?.description||n.label||'';
  const parent=nodes.find(x=>x.id===n.parentId);
  const childAgents=nodes.filter(x=>x.parentId===n.id&&x.type!=='group');
  const childGroups=nodes.filter(x=>x.parentId===n.id&&x.type==='group');

  let h=`<div class="ds"><div class="dl">Mission / Prompt</div><div class="dm">${esc(prompt.slice(0,800))}</div></div>`;
  h+=`<div class="ds"><div class="dl">Attributes</div>
    <div class="dr"><span class="k">Status</span><span class="v" style="color:${n.status==='active'?'var(--green)':n.status==='error'?'var(--red)':'var(--tx2)'}">${n.status}</span></div>
    <div class="dr"><span class="k">Type</span><span class="v">${n.type==='skill'?'Skill':'Agent'}</span></div>
    <div class="dr"><span class="k">Duration</span><span class="v">${fd(n.duration)||'running...'}</span></div>
    <div class="dr"><span class="k">Started</span><span class="v">${ft(sp?.start)}</span></div>
    ${sp?.end?`<div class="dr"><span class="k">Ended</span><span class="v">${ft(sp.end)}</span></div>`:''}
  </div>`;

  if(parent) h+=`<div class="ds"><div class="dl">Spawned By</div>${nodeLink(parent)}</div>`;

  if(childAgents.length){
    h+=`<div class="ds"><div class="dl">Sub-Agents (${childAgents.length})</div>`;
    for(const a of childAgents) h+=nodeLink(a);
    h+=`</div>`;
  }
  if(childGroups.length){
    h+=`<div class="ds"><div class="dl">Tool Usage</div>`;
    for(const g of childGroups) h+=nodeLink(g);
    h+=`</div>`;
  }

  if(sp?.output){
    h+=`<div class="ds"><div class="dl">Output</div><div class="dm">${esc(typeof sp.output==='string'?sp.output.slice(0,600):JSON.stringify(sp.output,null,2).slice(0,600))}</div></div>`;
  }
  body.innerHTML=h;
}

function nodeLink(n){
  const col=n.type==='root'?'#00e5cc':(n.type==='group'?tc(n.tool):(n.type==='skill'?'#f0b429':'#00e5cc'));
  const icon=n.type==='root'?'⬡':(n.type==='group'?'◆':(n.type==='skill'?'⚡':'◈'));
  const stCol=n.status==='active'?'var(--green)':(n.status==='error'?'var(--red)':'var(--tx3)');
  return `<div style="display:flex;align-items:center;gap:5px;padding:3px 6px;margin:1px 0;border-radius:3px;cursor:pointer;font-size:11px;border:1px solid transparent" onmouseover="this.style.background='var(--bg4)';this.style.borderColor='var(--bdr)'" onmouseout="this.style.background='';this.style.borderColor='transparent'" onclick="selNode('${n.id}')"><span style="color:${col};font-size:12px">${icon}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${col}">${esc(n.label)}</span><span style="font-size:9px;color:${stCol}">${n.status==='active'?'●':(n.status==='error'?'✕':'✓')}</span></div>`;
}

// ─── STATS ───
function updateStats(){
  document.getElementById('h-sp').textContent=ST.spans.length;
  document.getElementById('h-a').textContent=ST.spans.filter(s=>s.status==='active').length;
  document.getElementById('h-e').textContent=ST.spans.filter(s=>s.status==='error').length;
  fetch('/api/stats'+(ST.sid?'?sid='+ST.sid:'')).then(r=>r.json()).then(d=>{
    document.getElementById('h-c').textContent='$'+(d.est_cost_usd||0).toFixed(3);
  }).catch(()=>{});
}
function render(){rSess();rGraph();if(ST.sel)renderPanel();updateStats();}

let _rt=null;
function scheduleRender(){if(_rt)return;_rt=setTimeout(()=>{_rt=null;ST.spans=bSpans(filt());render();},300);}
function connect(){
  const es=new EventSource('/events');
  es.onmessage=e=>{if(ST.paused)return;try{const ev=JSON.parse(e.data);ST.events.push(ev);if(!ST.sid&&ev.sid)ST.sid=ev.sid;scheduleRender();}catch{}};
  es.onerror=()=>{es.close();setTimeout(connect,2000);};
}
async function boot(){
  try{
    ST.events=await(await fetch('/api/events?limit=5000')).json();
    if(ST.events.length){const m={};for(const ev of ST.events)m[ev.sid]=ev.ts;ST.sid=Object.entries(m).sort((a,b)=>new Date(b[1])-new Date(a[1]))[0][0];}
    ST.spans=bSpans(filt());render();
  }catch(e){console.error(e);}
  connect();
  window.addEventListener('resize',()=>rGraph());
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ST.sel)closePanel();});
}
setInterval(()=>{if(!ST.paused&&ST.spans.some(s=>s.status==='active'))rGraph();},1500);
setInterval(()=>{if(!ST.paused)updateStats();},5000);
function clearAll(){fetch('/api/clear',{method:'POST'}).then(()=>{ST.events=[];ST.spans=[];ST.sid=null;ST.sel=null;closePanel();render();});}
function togglePause(){ST.paused=!ST.paused;document.getElementById('bp').textContent=ST.paused?'Resume':'Pause';document.getElementById('bp').classList.toggle('on',ST.paused);}
boot();
</script>
</body>
