<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harness Dashboard</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,sans-serif;
    background:#0a0e14;color:#c5cdd9;min-height:100vh;
  }
  header{
    background:#12161f;border-bottom:1px solid #2a3040;
    padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;
  }
  header h1{font-size:1.4rem;font-weight:600;color:#e0e6ed;letter-spacing:0.02em}
  header .active-count{
    background:#1a2a1f;color:#00e676;border:1px solid #00e67644;
    padding:0.25rem 0.75rem;border-radius:999px;font-size:0.85rem;font-weight:500;
  }
  .connection-status{font-size:0.75rem;margin-left:1rem;opacity:0.7}
  .connection-status.connected{color:#00e676}
  .connection-status.disconnected{color:#ff5252}
  main{padding:2rem;max-width:1400px;margin:0 auto}
  h2{font-size:1.1rem;color:#8899aa;margin-bottom:1rem;font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem;margin-bottom:2rem}
  .card{
    background:#1a1f2e;border:1px solid #2a3040;border-radius:10px;padding:1.25rem;
    transition:border-color 0.2s,box-shadow 0.2s;position:relative;
  }
  .card:hover{border-color:#3a4560;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
  .card-header{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem}
  .status-light{
    width:10px;height:10px;border-radius:50%;flex-shrink:0;
  }
  .status-light.running{background:#00e676;animation:pulse 2s ease-in-out infinite;color:#00e676}
  .status-light.pending{background:#ffc107;animation:pulse 3s ease-in-out infinite;color:#ffc107}
  .status-light.complete{background:#78909c}
  .status-light.failed{background:#ff5252}
  .status-light.cancelled{background:#ff5252;opacity:0.7}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 4px currentColor}
    50%{box-shadow:0 0 12px currentColor,0 0 24px currentColor}
  }
  .status-label{
    font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;
  }
  .status-label.running{color:#00e676}
  .status-label.pending{color:#ffc107}
  .status-label.complete{color:#78909c}
  .status-label.failed{color:#ff5252}
  .status-label.cancelled{color:#ff5252}
  .agent-type{
    margin-left:auto;font-size:0.75rem;padding:0.15rem 0.5rem;
    background:#2a3040;border-radius:4px;color:#8899aa;font-weight:500;
  }
  .card-desc{color:#dde3ea;font-size:0.95rem;margin-bottom:0.75rem;line-height:1.4}
  .card-meta{
    display:flex;align-items:center;gap:1rem;font-size:0.8rem;color:#6b7d8e;
    margin-bottom:0.75rem;
  }
  .card-meta span{display:flex;align-items:center;gap:0.3rem}
  .card-parent{font-size:0.75rem;color:#5a6a7a;margin-bottom:0.5rem}
  .cancel-btn{
    background:transparent;border:1px solid #ff525266;color:#ff5252;
    padding:0.35rem 0.9rem;border-radius:6px;cursor:pointer;
    font-size:0.8rem;font-weight:500;transition:all 0.15s;float:right;
  }
  .cancel-btn:hover{background:#ff525222;border-color:#ff5252}
  .cancel-btn:active{transform:scale(0.97)}
  .cancel-btn:disabled{opacity:0.3;cursor:not-allowed}
  .events-section{margin-top:1rem}
  .events-list{
    background:#12161f;border:1px solid #2a3040;border-radius:10px;
    max-height:300px;overflow-y:auto;padding:0.5rem 0;
  }
  .event-item{
    padding:0.5rem 1rem;display:flex;align-items:flex-start;gap:0.75rem;
    border-bottom:1px solid #1a1f2e;font-size:0.82rem;
  }
  .event-item:last-child{border-bottom:none}
  .event-time{color:#556677;white-space:nowrap;min-width:5.5rem;font-variant-numeric:tabular-nums}
  .event-badge{
    font-size:0.7rem;font-weight:600;text-transform:uppercase;
    padding:0.1rem 0.4rem;border-radius:3px;white-space:nowrap;min-width:4.5rem;text-align:center;
  }
  .event-badge.spawn{background:#00e67622;color:#00e676}
  .event-badge.update{background:#448aff22;color:#448aff}
  .event-badge.complete{background:#78909c22;color:#78909c}
  .event-badge.cancel{background:#ff525222;color:#ff5252}
  .event-badge.fail{background:#ff525222;color:#ff5252}
  .event-detail{color:#9aabb8;flex:1}
  .empty-state{
    text-align:center;padding:3rem;color:#556677;font-size:0.95rem;
  }
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:#0a0e14}
  ::-webkit-scrollbar-thumb{background:#2a3040;border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:#3a4560}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center">
    <h1>Harness Dashboard</h1>
    <span class="connection-status disconnected" id="connStatus">disconnected</span>
  </div>
  <span class="active-count" id="activeCount">0 active</span>
</header>
<main>
  <h2>Agents</h2>
  <div class="grid" id="agentGrid">
    <div class="empty-state" id="emptyState">No agents registered</div>
  </div>

  <div class="events-section">
    <h2>Event Timeline</h2>
    <div class="events-list" id="eventsList">
      <div class="empty-state">Waiting for events...</div>
    </div>
  </div>
</main>

<script>
(function() {
  "use strict";

  var agents = {};
  var events = [];
  var MAX_EVENTS = 100;
  var durationIntervalId = null;

  function formatTime(ts) {
    var d = new Date(ts);
    return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(s));
    return div.innerHTML;
  }

  function renderAgents() {
    var grid = document.getElementById('agentGrid');
    var empty = document.getElementById('emptyState');
    var keys = Object.keys(agents);

    if (keys.length === 0) {
      grid.innerHTML = '';
      grid.appendChild(empty);
      empty.style.display = '';
      document.getElementById('activeCount').textContent = '0 active';
      return;
    }

    // Sort by started_at descending
    keys.sort(function(a,b) {
      return new Date(agents[b].started_at) - new Date(agents[a].started_at);
    });

    var activeCount = 0;
    var html = '';
    for (var i = 0; i < keys.length; i++) {
      var ag = agents[keys[i]];
      var st = ag.status || 'pending';
      if (st === 'running' || st === 'pending') activeCount++;
      var canCancel = (st === 'running' || st === 'pending');

      html += '<div class="card" data-id="' + escapeHtml(ag.id) + '">';
      html += '<div class="card-header">';
      html += '<div class="status-light ' + st + '"></div>';
      html += '<span class="status-label ' + st + '">' + escapeHtml(st) + '</span>';
      html += '<span class="agent-type">' + escapeHtml(ag.type || 'unknown') + '</span>';
      html += '</div>';
      html += '<div class="card-desc">' + escapeHtml(ag.description || '') + '</div>';
      if (ag.parent_id) {
        html += '<div class="card-parent">Parent: ' + escapeHtml(ag.parent_id) + '</div>';
      }
      html += '<div class="card-meta">';
      html += '<span data-duration-for="' + escapeHtml(ag.id) + '"  data-started="' + ag.started_at + '" data-status="' + st + '">';
      html += getLiveDuration(ag);
      html += '</span>';
      if (ag.progress) {
        html += '<span>' + escapeHtml(ag.progress) + '</span>';
      }
      html += '</div>';
      if (canCancel) {
        html += '<button class="cancel-btn" onclick="cancelAgent(\'' + escapeHtml(ag.id) + '\')">Cancel</button>';
      }
      html += '</div>';
    }
    grid.innerHTML = html;
    document.getElementById('activeCount').textContent = activeCount + ' active';
  }

  function getLiveDuration(ag) {
    var st = ag.status || 'pending';
    if (st === 'running' || st === 'pending') {
      var elapsed = Date.now() - new Date(ag.started_at).getTime();
      return formatElapsed(elapsed);
    }
    return ag.duration || '0s';
  }

  function formatElapsed(ms) {
    var s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    s = s % 60;
    if (h > 0) return h + 'h ' + m + 'm ' + s + 's';
    if (m > 0) return m + 'm ' + s + 's';
    return s + 's';
  }

  function updateLiveDurations() {
    var els = document.querySelectorAll('[data-duration-for]');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      var st = el.getAttribute('data-status');
      if (st === 'running' || st === 'pending') {
        var started = new Date(el.getAttribute('data-started')).getTime();
        var elapsed = Date.now() - started;
        el.textContent = formatElapsed(elapsed);
      }
    }
  }

  function renderEvents() {
    var list = document.getElementById('eventsList');
    if (events.length === 0) {
      list.innerHTML = '<div class="empty-state">Waiting for events...</div>';
      return;
    }
    var html = '';
    // Show newest first
    for (var i = events.length - 1; i >= 0; i--) {
      var ev = events[i];
      html += '<div class="event-item">';
      html += '<span class="event-time">' + formatTime(ev.ts) + '</span>';
      html += '<span class="event-badge ' + escapeHtml(ev.type) + '">' + escapeHtml(ev.type) + '</span>';
      html += '<span class="event-detail">' + escapeHtml(ev.detail || '') + '</span>';
      html += '</div>';
    }
    list.innerHTML = html;
  }

  window.cancelAgent = function(id) {
    var btn = document.querySelector('.card[data-id="' + id + '"] .cancel-btn');
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Cancelling...';
    }
    fetch('/api/agents/' + encodeURIComponent(id) + '/cancel', {method:'POST'})
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.error) {
          alert('Cancel failed: ' + data.error);
          if (btn) { btn.disabled = false; btn.textContent = 'Cancel'; }
        }
        // SSE will update the UI
      })
      .catch(function(err) {
        alert('Cancel request failed: ' + err);
        if (btn) { btn.disabled = false; btn.textContent = 'Cancel'; }
      });
  };

  function loadAgents() {
    fetch('/api/agents')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        agents = {};
        if (Array.isArray(data)) {
          for (var i = 0; i < data.length; i++) {
            agents[data[i].id] = data[i];
          }
        }
        renderAgents();
      })
      .catch(function(err) { console.error('Failed to load agents:', err); });
  }

  function connectSSE() {
    var source = new EventSource('/events');
    var statusEl = document.getElementById('connStatus');

    source.onopen = function() {
      statusEl.textContent = 'connected';
      statusEl.className = 'connection-status connected';
    };

    source.onmessage = function(e) {
      try {
        var ev = JSON.parse(e.data);
        if (events.length >= MAX_EVENTS) events.shift();
        events.push(ev);
        renderEvents();
        // Refresh agent list on any event
        loadAgents();
      } catch(err) {
        console.error('SSE parse error:', err);
      }
    };

    source.onerror = function() {
      statusEl.textContent = 'disconnected';
      statusEl.className = 'connection-status disconnected';
      source.close();
      // Reconnect after 3 seconds
      setTimeout(connectSSE, 3000);
    };
  }

  // Initial load
  loadAgents();
  connectSSE();

  // Update live durations every second
  durationIntervalId = setInterval(updateLiveDurations, 1000);
})();
</script>
</body>
</html>
